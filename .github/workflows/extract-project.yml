name: Extract Ugolki source

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project archive
        run: |
          mkdir -p source-inspection
          unzip -o ugolki-android-project-cloud-build.zip -d source-inspection
          find source-inspection -maxdepth 5 -type f

      - name: Commit extracted source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source-inspection
          git commit -m "Extract project source for inspection" || echo "No changes to commit"
          git push