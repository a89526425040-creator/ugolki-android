

name: Build Ugolki APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'source-inspection/app/src/main/assets/index.html'
      - 'ugolki-android-project-cloud-build.zip'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: unzip -o ugolki-android-project-cloud-build.zip -d .

      - name: Install updated Supabase game
        run: |
          cp source-inspection/app/src/main/assets/index.html app/src/main/assets/index.html

      - name: Configure WebView and Internet
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("app/build.gradle.kts")
          s = p.read_text()
          if "androidx.webkit:webkit" not in s:
              s += '\ndependencies {\n    implementation("androidx.webkit:webkit:1.12.1")\n}\n'
          p.write_text(s)

          manifest = Path("app/src/main/AndroidManifest.xml")
          s = manifest.read_text()
          if "android.permission.INTERNET" not in s:
              s, count = re.subn(
                  r'(<manifest\b[^>]*>)',
                  r'\1\n    <uses-permission android:name="android.permission.INTERNET" />',
                  s,
                  count=1
              )
              if count == 0:
                  raise SystemExit("Manifest tag not found")
          manifest.write_text(s)

          main = next(Path("app/src/main/java").rglob("MainActivity.kt"))
          old = main.read_text()
          match = re.search(r'^package\s+([\w.]+)', old, re.M)
          if not match:
              raise SystemExit("Kotlin package not found")
          package = match.group(1)

          main.write_text(f'''package {package}

          import android.app.Activity
          import android.os.Bundle
          import android.webkit.WebView
          import android.webkit.WebResourceRequest
          import android.view.View
          import androidx.webkit.WebViewAssetLoader
          import androidx.webkit.WebViewClientCompat

          class MainActivity : Activity() {{
              @Suppress("SetJavaScriptEnabled")
              override fun onCreate(savedInstanceState: Bundle?) {{
                  super.onCreate(savedInstanceState)

                  window.decorView.systemUiVisibility =
                      View.SYSTEM_UI_FLAG_FULLSCREEN or
                      View.SYSTEM_UI_FLAG_LAYOUT_STABLE or
                      View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION

                  val web = WebView(this)
                  web.settings.javaScriptEnabled = true
                  web.settings.domStorageEnabled = true
                  web.settings.allowFileAccess = false

                  val assetLoader = WebViewAssetLoader.Builder()
                      .addPathHandler(
                          "/assets/",
                          WebViewAssetLoader.AssetsPathHandler(this)
                      )
                      .build()

                  web.webViewClient = object : WebViewClientCompat() {{
                      override fun shouldInterceptRequest(
                          view: WebView,
                          request: WebResourceRequest
                      ) = assetLoader.shouldInterceptRequest(request.url)
                  }}

                  web.setBackgroundColor(android.graphics.Color.rgb(31, 25, 20))
                  setContentView(web)
                  web.loadUrl("https://appassets.androidplatform.net/assets/index.html")
              }}
          }}
          ''')
          PY

      - name: Align Kotlin JVM target
        run: |
          sed -i '/^android {/a\    kotlinOptions { jvmTarget = "1.8" }' app/build.gradle.kts

      - name: Build APK
        run: gradle --no-daemon -p . assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ugolki-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
