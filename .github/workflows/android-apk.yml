
name: Build Ugolki APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'ugolki-android-project-cloud-build.zip'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: unzip -o ugolki-android-project-cloud-build.zip -d .
      - name: Fix internet permission and Firebase startup
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/src/main/AndroidManifest.xml")
          s = p.read_text()
          marker = '<manifest xmlns:android="http://schemas.android.com/apk/res/android>'
          if "android.permission.INTERNET" not in s:
              s = s.replace(marker, marker + '\n    <uses-permission android:name="android.permission.INTERNET" />', 1)
          p.write_text(s)

          p = Path("app/src/main/assets/index.html")
          s = p.read_text()
          old = """firebase.initializeApp(firebaseConfig);
          firebase.auth().signInAnonymously().then(cred=>{authUser=cred.user;db=firebase.database();onlineStatus.textContent='Готово к игре онлайн';}).catch(err=>{onlineStatus.textContent='Ошибка подключения: '+err.message;});"""
          new = """try {
            if (typeof firebase === 'undefined') throw new Error('Firebase SDK не загрузился. Проверь интернет.');
            firebase.initializeApp(firebaseConfig);
            firebase.auth().signInAnonymously().then(cred=>{authUser=cred.user;db=firebase.database();onlineStatus.textContent='Готово к игре онлайн';}).catch(err=>{onlineStatus.textContent='Ошибка подключения: '+err.message;});
          } catch(err) {
            onlineStatus.textContent='Ошибка Firebase: '+err.message;
          }"""
          if old not in s:
              raise SystemExit("Firebase block not found")
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Bundle Firebase SDK locally
        run: |
          mkdir -p app/src/main/assets/firebase
          curl -fL https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js -o app/src/main/assets/firebase/firebase-app-compat.js
          curl -fL https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js -o app/src/main/assets/firebase/firebase-auth-compat.js
          curl -fL https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js -o app/src/main/assets/firebase/firebase-database-compat.js
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/src/main/assets/index.html")
          s = p.read_text()
          files = {
              "https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js": "firebase/firebase-app-compat.js",
              "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js": "firebase/firebase-auth-compat.js",
              "https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js": "firebase/firebase-database-compat.js"
          }
          for old, new in files.items():
              if old not in s:
                  raise SystemExit("Firebase script not found: " + old)
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Upload source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ugolki-source
          path: ugolki-android-project-cloud-build.zip
          retention-days: 7
      - name: Align Kotlin JVM target
        run: |
          sed -i '/^android {/a\    kotlinOptions { jvmTarget = "1.8" }' app/build.gradle.kts
      - name: Build APK
        run: gradle --no-daemon -p . assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ugolki-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          
